name: ringdown
description: Technician alarm inbox for the NMS Alert Gateway.
publish_to: "none"
version: 1.0.0+13
environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.0
  connectivity_plus: ^6.1.4
  dio: ^5.8.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  in_app_update: ^4.2.3
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/ringdown_icon_1024.png
  adaptive_icon_foreground: assets/icon/ringdown_foreground.png
  adaptive_icon_background: "#1a1a1a"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/ringdown_icon_1024.png
